[workspace]
resolver = "3"
members = ["crates/*", "apps/dock", "apps/settings", "spikes"]

[workspace.package]
version = "4.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
windows = "0.62"
windows-core = "0.62"
windows-numerics = "0.3"
whirlpool-config = { path = "crates/whirlpool-config" }
whirlpool-core = { path = "crates/whirlpool-core" }
whirlpool-shell = { path = "crates/whirlpool-shell" }

[workspace.lints.clippy]
perf = { level = "deny", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
# Smaller code means fewer pages touched and less memory held while idle.
opt-level = "s"
# Un fallo cierra el proceso sin más: el guardián devuelve la barra de tareas.
panic = "abort"
