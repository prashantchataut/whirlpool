name: Showcase

# Real captures of every surface at 1920x1080, 1:1, on a photo wallpaper and a fresh profile.
# Also presses the volume keys and records whether the stock flyout ever appeared.
on:
  workflow_dispatch:

jobs:
  showcase:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p whirlpool
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch 4K pictures with Edge
        # 4kwallpapers.com puts a bot check in front of plain HTTP clients, so the program's own download is
        # refused here. A real Edge window may pass it. The pictures go to the studio's cache; the studio then
        # applies them from there. Whatever fails is logged and the driver falls back to the photo pack.
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          npm install --no-save --no-audit --no-fund playwright-core
          $cache = Join-Path $env:LOCALAPPDATA 'Whirlpool\wallpapers'
          node scripts/fetch-4k.mjs $cache 27371 27986 27362 28066 27369 27374 26734 2>&1 | Tee-Object out/fetch-4k.txt
          node scripts/fetch-4k.mjs $cache --previews-only --all 2>&1 | Tee-Object -Append out/fetch-4k.txt
      - name: Resolution
        shell: pwsh
        continue-on-error: true
        run: pwsh scripts/set-dpi.ps1 -Scale 100 -Resolution 1920x1080 -Out out
      - name: Capture
        shell: pwsh
        run: pwsh scripts/showcase.ps1 -Exe target/release/whirlpool.exe -Out out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: showcase
          path: out/
