name: Captures

# Starts the real release build on a Windows runner and photographs the screen.
# The images are what the README and the site use; nothing is drawn by hand.
on:
  workflow_dispatch:
  push:
    branches: [design-pass-4.2]
    paths: [".github/workflows/captures.yml"]

jobs:
  capture:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p whirlpool
      - name: Capture Settings, quick settings, menu bar top and bottom
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function KillAll { Get-Process whirlpool -ErrorAction SilentlyContinue | Stop-Process -Force; Start-Sleep 2 }
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("out/$name.png")
            "$name : $($b.Width)x$($b.Height)" | Tee-Object -Append out/log.txt
          }
          $exe = (Resolve-Path target/release/whirlpool.exe).Path
          $dir = Join-Path $env:APPDATA "Whirlpool"
          New-Item -ItemType Directory -Force $dir | Out-Null

          # Settings, every page.
          foreach ($page in 'dock','menubar','personalize','windows','system','about') {
            $env:WHIRLPOOL_PAGE = $page
            KillAll
            $p = Start-Process $exe -ArgumentList '--settings' -PassThru
            Start-Sleep 9
            Shot "settings-$page"
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep 1
          }
          Remove-Item Env:WHIRLPOOL_PAGE

          # Quick settings, opened from a top bar and from a bottom bar.
          KillAll
          $p = Start-Process $exe -ArgumentList '--quick-settings', '1000', '30', 'top' -PassThru
          Start-Sleep 12; Shot "quick-top"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          KillAll
          $p = Start-Process $exe -ArgumentList '--quick-settings', '1000', '700', 'bottom' -PassThru
          Start-Sleep 12; Shot "quick-bottom"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

          # The shell itself: bar on top, then floating on the bottom above the dock.
          foreach ($case in @(
            @{ name = 'shell-top'; json = '{"menuBar":true,"menuBarPosition":"top"}' },
            @{ name = 'shell-bottom-floating'; json = '{"menuBar":true,"menuBarPosition":"bottom","menuBarStyle":"floating"}' })) {
            Set-Content -Path (Join-Path $dir 'config.json') -Value $case.json
            KillAll
            $p = Start-Process $exe -PassThru
            Start-Sleep 14
            Shot $case.name
            & $exe --quit
            Start-Sleep 2
            & $exe --restore
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep 2
          }
          Copy-Item "$env:LOCALAPPDATA\Whirlpool\whirlpool.log" out/whirlpool.log -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: out
