name: Release

# Push a tag such as v0.2.0 to build both programs on Windows and attach the
# executables to a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p muelle -p muelle-settings
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/muelle.exe, target/release/muelle-settings.exe dist/
          Copy-Item scripts/install.ps1 dist/
          Compress-Archive -Path dist/muelle.exe, dist/muelle-settings.exe -DestinationPath dist/Muelle-Native-x64.zip
          Push-Location dist
          Get-FileHash muelle.exe, muelle-settings.exe, Muelle-Native-x64.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content SHA256SUMS.txt
          Pop-Location
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/muelle.exe
            dist/muelle-settings.exe
            dist/Muelle-Native-x64.zip
            dist/install.ps1
            dist/SHA256SUMS.txt
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        with:
          name: muelle-native-x64
          path: dist/*
