name: Screenshots

# Builds the app, starts it on a real Windows desktop, drives it with real mouse and keyboard input
# and uploads what the screen showed. Nothing here is drawn by hand. x64 on windows-latest, ARM64
# natively on windows-11-arm (the ARM binary is built and run there, not cross-compiled).
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Run only scenarios whose name contains this text (empty runs all)'
        default: ''
  # Required on every pull request, with no path filter: a docs-only PR still proves the app starts and paints.
  pull_request:
  push:
    branches: [feat/usable-island-launchpad-drag, feat/gaps-session-5]
    paths:
      - "apps/**"
      - "crates/**"
      - "scripts/drive.ps1"
      - ".github/workflows/screenshots.yml"
      - "Cargo.*"

jobs:
  matrix:
    name: capture matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-matrix.mjs

  screenshots:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: shots-${{ matrix.os }}
      - name: Build
        run: cargo build --release -p whirlpool
      - name: Drive the app and photograph it
        shell: pwsh
        # No continue-on-error: the driver exits 1 when a window never appears or a frame is blank.
        run: ./scripts/drive.ps1 -Exe (Resolve-Path target/release/whirlpool.exe).Path -Out out -Only '${{ inputs.only }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.os }}
          path: out
      - name: Every screen in the capture matrix was written
        if: always() && inputs.only == ''
        run: node scripts/check-matrix.mjs --verify out
