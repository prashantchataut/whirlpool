[package]
name = "whirlpool-settings"
description = "Native Rust settings window for the Whirlpool dock"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
whirlpool-config.workspace = true
whirlpool-shell.workspace = true
whirlpool-update.workspace = true
whirlpool-core.workspace = true
serde.workspace = true
serde_json = "1"
png = "0.18"
jpeg-decoder = { version = "0.3", default-features = false }
windows = { workspace = true, features = ["Foundation", "Foundation_Collections", "Devices_Radios", "Web_Http", "Web_Http_Headers", "Win32_System_Com", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
windows-future = "0.3"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wgpu_no_default_features"] }
wgpu = { version = "30", default-features = false, features = ["dx12", "wgsl", "parking_lot"] }
