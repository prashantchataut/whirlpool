[package]
name = "whirlpool-settings"
description = "Native Rust settings window for the Whirlpool dock"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
whirlpool-config.workspace = true
whirlpool-shell.workspace = true
whirlpool-core.workspace = true
serde.workspace = true
serde_json = "1"
png = "0.18"
windows = { workspace = true, features = ["Foundation", "Web_Http", "Web_Http_Headers"] }
windows-future = "0.3"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wgpu_no_default_features"] }
wgpu = { version = "30", default-features = false, features = ["dx12", "wgsl", "parking_lot"] }
