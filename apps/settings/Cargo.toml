[package]
name = "whirlpool-settings"
description = "Native Rust settings window for the Whirlpool dock"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "whirlpool-settings"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
whirlpool-config.workspace = true
whirlpool-shell.workspace = true
serde.workspace = true
serde_json = "1"
windows = { workspace = true, features = ["Foundation", "Web_Http", "Web_Http_Headers"] }
windows-future = "0.3"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
