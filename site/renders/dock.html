<!doctype html><meta charset="utf-8"><title>Whirlpool dock render</title>
<link rel="stylesheet" href="../assets/ui.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#000}.desk{width:1600px;height:1000px}</style>
<div class="desk" id="d"></div>
<script>window.WP_BASE='../'</script><script src="../assets/ui.js"></script>
<script>
const d=document.getElementById('d');
d.innerHTML=Whirlpool.menubar({app:'Browser',clock:'Fri  14:32'})+Whirlpool.popover()+Whirlpool.dock({size:58});
// freeze magnification on the Browser icon, exactly as the dock would draw it
const apps=[...d.querySelectorAll('.app')];const k=[1,1.62,1.34,1.1,1,1,1,1,1,1,1];
let i=0;apps.forEach((a,idx)=>{const s=58*k[idx];a.style.width=a.style.height=s+'px'});

</script>
