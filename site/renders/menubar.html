<!doctype html><meta charset="utf-8"><title>Whirlpool menu bar render</title>
<link rel="stylesheet" href="../assets/ui.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#000}.desk{width:1600px;height:620px}
.card{position:absolute;top:44px;left:50%;transform:translateX(-50%);width:420px;padding:18px 20px 16px;border-radius:20px;background:rgba(5,30,39,.74);backdrop-filter:blur(30px);border:1px solid rgba(159,240,230,.18);box-shadow:0 30px 70px rgba(0,14,22,.55);z-index:6}
.card h4{margin:0 0 12px;font:600 11px Inter;letter-spacing:.14em;text-transform:uppercase;color:#84a5ab}
.u{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:12px;margin:11px 0;font-size:13px}
.u .tr{height:7px;border-radius:4px;background:rgba(159,240,230,.14);overflow:hidden}.u .tr u{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#0e9398,#9ff0e6)}
.u em{font-style:normal;text-align:right;color:#9ff0e6;font-variant-numeric:tabular-nums;font-weight:500}
.u small{display:block;color:#84a5ab;font-size:11px;margin-top:1px}
.np{display:flex;gap:12px;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid rgba(159,240,230,.12)}
.np .art{width:44px;height:44px;border-radius:10px;background:linear-gradient(145deg,#ff9a6b,#e0483f)}
.np b{display:block;font-size:13px;font-weight:600}.np span{font-size:12px;color:#84a5ab}
.qs{position:absolute;top:44px;right:16px;width:290px;padding:16px;border-radius:20px;background:rgba(5,30,39,.74);backdrop-filter:blur(30px);border:1px solid rgba(159,240,230,.18);box-shadow:0 30px 70px rgba(0,14,22,.55);z-index:6}
.sl{display:flex;align-items:center;gap:10px;margin:6px 0 14px;font-size:12.5px}.sl .tr{flex:1;height:26px;border-radius:13px;background:rgba(159,240,230,.14);overflow:hidden}.sl .tr u{display:block;height:100%;width:64%;background:#e7f3f0;border-radius:13px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chip{padding:11px 12px;border-radius:14px;background:rgba(159,240,230,.10);font-size:12.5px;font-weight:500}.chip.on{background:#0e9398}.chip small{display:block;font-weight:400;opacity:.75;font-size:11px}
</style>
<div class="desk" id="d"></div>
<script>window.WP_BASE='../'</script><script src="../assets/ui.js"></script>
<script>
const d=document.getElementById('d');
d.innerHTML=Whirlpool.menubar({app:'Terminal',clock:'Fri  14:32'})+`
<div class="card"><h4>Plan usage</h4>
 <div class="u"><div>Session<small>resets in 2h 10m</small></div><div class="tr"><u style="width:62%"></u></div><em>62%</em></div>
 <div class="u"><div>Weekly<small>resets Monday</small></div><div class="tr"><u style="width:31%"></u></div><em>31%</em></div>
 <div class="u"><div>Fast model<small>separate quota</small></div><div class="tr"><u style="width:18%"></u></div><em>18%</em></div>
 <div class="np"><div class="art"></div><div><b>Low Tide, Late Light</b><span>Now playing · 2:14 / 4:08</span></div></div></div>
<div class="qs"><h4 style="margin:0 0 12px;font:600 11px Inter;letter-spacing:.14em;text-transform:uppercase;color:#84a5ab">Quick settings</h4>
 <div class="sl">Volume<div class="tr"><u></u></div></div>
 <div class="chips"><div class="chip on">Wi-Fi<small>Harbor-5G</small></div><div class="chip on">Bluetooth<small>2 devices</small></div><div class="chip">Focus<small>Off</small></div><div class="chip">Battery<small>86% · 5 h 40 m</small></div></div></div>`;
</script>
